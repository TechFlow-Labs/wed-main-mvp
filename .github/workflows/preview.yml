name: Preview Deployment (Main)

on:
  push:
    branches-ignore:
      - main
      - master
  delete:
  pull_request:
    types: [closed]

concurrency:
  group: preview-main-${{ github.head_ref || github.ref_name || github.event.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Compute branch slug
        id: slug
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "app_name=main-prev-$SLUG" >> "$GITHUB_OUTPUT"
          echo "fqdn=https://${SLUG}-app.${{ vars.PREVIEW_DOMAIN }}" >> "$GITHUB_OUTPUT"
          echo "backend_url=https://${SLUG}-api.${{ vars.PREVIEW_DOMAIN }}" >> "$GITHUB_OUTPUT"

      - name: Find or create Coolify app
        id: coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          APP_NAME="${{ steps.slug.outputs.app_name }}"

          # Try to find existing app
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_URL/api/v1/applications" || echo '{}')

          UUID=$(echo "$RESPONSE" | jq -r --arg name "$APP_NAME" '.[] | select(.name == $name) | .uuid // empty' | head -1)

          if [ -z "$UUID" ]; then
            echo "Creating new Coolify app: $APP_NAME"
            CREATE=$(curl -sf -X POST \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg project_uuid "${{ secrets.COOLIFY_PROJECT_UUID }}" \
                --arg server_uuid "${{ secrets.COOLIFY_SERVER_UUID }}" \
                --arg github_app_uuid "${{ secrets.COOLIFY_GITHUB_APP_UUID }}" \
                --arg branch "$GITHUB_REF_NAME" \
                --arg name "$APP_NAME" \
                --arg fqdn "${{ steps.slug.outputs.fqdn }}" \
                '{
                  project_uuid: $project_uuid,
                  server_uuid: $server_uuid,
                  environment_name: "preview",
                  github_app_uuid: $github_app_uuid,
                  git_repository: "techflow-labs/wed-main-mvp",
                  git_branch: $branch,
                  build_pack: "dockerfile",
                  dockerfile_location: "/Dockerfile.preview",
                  ports_exposes: "80",
                  name: $name,
                  fqdn: $fqdn,
                  instant_deploy: false
                }')" \
              "$COOLIFY_URL/api/v1/applications/github-app")
            UUID=$(echo "$CREATE" | jq -r '.uuid')
            echo "Created app with UUID: $UUID"
          else
            echo "Found existing app with UUID: $UUID"
          fi

          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"

      - name: Sync environment variables
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          UUID="${{ steps.coolify.outputs.uuid }}"
          BACKEND_URL="${{ steps.slug.outputs.backend_url }}"

          curl -sf -X PATCH \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg backend_url "$BACKEND_URL" \
              '{
                data: [
                  { key: "EXPO_PUBLIC_API_URL", value: $backend_url, is_build_time: true }
                ]
              }')" \
            "$COOLIFY_URL/api/v1/applications/$UUID/envs/bulk"

      - name: Trigger deployment
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          UUID="${{ steps.coolify.outputs.uuid }}"
          curl -sf -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$UUID&force=false"

      - name: Write preview URL to summary
        run: |
          echo "## Preview Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**App (Expo Web):** ${{ steps.slug.outputs.fqdn }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Backend:** ${{ steps.slug.outputs.backend_url }}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: |
      github.event_name == 'delete' ||
      (github.event_name == 'pull_request' && github.event.action == 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Compute branch slug
        id: slug
        run: |
          BRANCH="${{ github.head_ref || github.event.ref }}"
          SLUG=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-//;s/-$//')
          echo "app_name=main-prev-$SLUG" >> "$GITHUB_OUTPUT"

      - name: Delete Coolify app
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          APP_NAME="${{ steps.slug.outputs.app_name }}"

          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_URL/api/v1/applications" || echo '{}')

          UUID=$(echo "$RESPONSE" | jq -r --arg name "$APP_NAME" '.[] | select(.name == $name) | .uuid // empty' | head -1)

          if [ -n "$UUID" ]; then
            echo "Deleting Coolify app: $APP_NAME ($UUID)"
            curl -sf -X DELETE \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$COOLIFY_URL/api/v1/applications/$UUID?delete_configurations=true&delete_volumes=true"
            echo "Deleted."
          else
            echo "App $APP_NAME not found, nothing to delete."
          fi
