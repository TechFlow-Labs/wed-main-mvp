server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # ^~ beats regex locations; Expo web emits /_expo/static/...
  location ^~ /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /favicon.ico {
    access_log off;
    log_not_found off;
    return 204;
  }

  # Same-origin /api as edge nginx on main.wedapp.gr; needed when using http://localhost:81 directly.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://host.docker.internal:8060;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
