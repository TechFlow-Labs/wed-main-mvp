services:
  web:
    build: .
    image: wedding-reservations-web:latest
    hostname: wedmainapp
    container_name: wedmainapp
    ports:
      - "81:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      local_sandbox_2:
        ipv4_address: 172.27.0.80
    restart: unless-stopped

networks:
  local_sandbox_2:
    external: true
    name: local_sandbox_2